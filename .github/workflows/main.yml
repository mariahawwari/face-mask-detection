name : ci pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build_and_test:
    runs_on: ubuntu_latest
      steps:
        - name: checkout
          uses: actions/checkout@v6.0.2
       - name: set up python
         uses: actions/setup-python@v6.1.0
         with:
           python-version: '3.10'
        - name: install dependancies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
        - name: Ci test 
          run: |
            echo "print(ci pipeline is working")"> test_ci.py
            python test_ci.py
